# ==============================================================================
# AIPENT — Full System Docker Compose
# Orchestrates the AIPENT Backend container and links to the MCP Gateway
# ==============================================================================
name: aipent

include:
  - path: mcp/compose.yaml

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aipent-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:8010"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./.env
        required: false
    environment:
      - AIPENT_MCP_ENABLED=true
      - AIPENT_MCP_TRANSPORT=gateway
      - AIPENT_MCP_GATEWAY_URL=http://host.docker.internal:8812/sse
      - AIPENT_LAB_TARGET_ALIAS=host.docker.internal
      - VULNIFY_SQLITE_PATH=/backend/vulnify.db
      - AIPENT_LLM_PROVIDER=${AIPENT_LLM_PROVIDER:-openrouter}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-true}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-aipent}
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8010", "--reload", "--reload-dir", "src"]
    volumes:
      - ./backend/src:/backend/src:ro
      - ./backend/data:/backend/data
      - ./vulnify.db:/backend/vulnify.db:ro
      - ./backend/.env:/backend/.env:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8010/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aipent-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
