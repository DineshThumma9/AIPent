# ==============================================================================
# AIPENT — MCP Tool Infrastructure Docker Compose
# Orchestrates all MCP backing services: ZAP, ZAP MCP Server, Vulnify MCP,
# Curl MCP, and Typst report compiler.
# ==============================================================================
name: aipent-mcp

services:
  zap:
    image: zaproxy/zap-stable:2.17.0
    restart: unless-stopped
    command:
      - zap.sh
      - -daemon
      - -host
      - 0.0.0.0
      - -port
      - "8090"
      - -config
      - api.key=${ZAP_API_KEY}
      - -config
      - api.addrs.addr.name=.*
      - -config
      - api.addrs.addr.regex=true
      - -addoninstall
      - spiderAjax
      - -addoninstall
      - client
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      ZAP_API_KEY: ${ZAP_API_KEY}
      ZAP_MEMORY: ${ZAP_MEMORY:-2G}
    env_file:
      - path: ../gateway/.env
        required: false
      - path: ../.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS \"http://127.0.0.1:8090/JSON/core/view/version/?apikey=$$ZAP_API_KEY\" >/dev/null",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    volumes:
      - ./zap/reports:/zap/wrk
      - ./zap/zap-home:/home/zap/.ZAP

  mcp-server:
    image: dtkmn/mcp-zap-server:v0.17.1
    restart: unless-stopped
    depends_on:
      zap:
        condition: service_healthy
    ports:
      - "127.0.0.1:7456:7456"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ZAP_API_URL: zap
      ZAP_API_PORT: "8090"
      ZAP_API_KEY: ${ZAP_API_KEY}
      MCP_API_KEY: ${MCP_API_KEY}
      MCP_SECURITY_MODE: api-key
      MCP_SECURITY_ENABLED: "true"
      ZAP_ALLOW_LOCALHOST: "true"
      ZAP_ALLOW_PRIVATE_NETWORKS: "true"
      ZAP_REPORT_DIRECTORY: /zap/wrk
      ZAP_MAX_ACTIVE_SCAN_DURATION: "30"
      ZAP_MAX_SPIDER_SCAN_DURATION: "2"
      ZAP_SPIDER_MAX_DEPTH: "5"
      ZAP_SPIDER_MAX_CHILDREN: "10"
      ZAP_SCAN_JOBS_STORE_BACKEND: in-memory
    env_file:
      - path: ../gateway/.env
        required: false
      - path: ../.env
        required: false
    volumes:
      - ./zap/reports:/zap/wrk
      - mcp-launch-safety:/var/lib/mcp-zap/scan-launch-safety

  vulnify-mcp:
    image: vulnify-mcp:latest
    build:
      context: ./vulnify
      dockerfile: Dockerfile.vulnify
    restart: unless-stopped
    volumes:
      - ../vulnify.db:/data/vulnify.db:ro
    environment:
      - VULNIFY_SQLITE_PATH=/data/vulnify.db
    ports:
      - "127.0.0.1:7457:7457"

  curl-mcp:
    image: curl-mcp:latest
    build:
      context: ./curl
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:7458:7458"
    environment:
      - PORT=7458

  typst:
    image: ghcr.io/typst/typst:latest
    container_name: aipent-typst
    restart: "no"

volumes:
  mcp-launch-safety:
