# Level 1 lab: one deliberately vulnerable web app.
# Loopback for the browser, plus the Docker bridge gateway for scanner
# containers. Never expose this port beyond the local machine.
name: aipent-lvl1

services:
  juice-shop:
    image: bkimminich/juice-shop:v20.3.0
    container_name: aipent-juice-shop
    ports:
      - "127.0.0.1:3000:3000"
      - "${AIPENT_LAB_BIND:-172.17.0.1}:3000:3000"
    restart: unless-stopped
    mem_limit: 2g
    environment:
      NODE_OPTIONS: "--max-old-space-size=1536"
    security_opt:
      - no-new-privileges:true
