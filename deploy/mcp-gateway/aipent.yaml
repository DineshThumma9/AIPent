registry:
  kali:
    name: kali
    title: Kali Linux MCP
    description: Local Kali Linux tool server exposing nmap and Nikto over MCP.
    type: server
    image: cyberillo/kali-mcp-server:latest
    longLived: true
    extraHosts:
      - "host.docker.internal:host-gateway"
    tools:
      - name: nmap_scan
        description: Run an nmap scan.
      - name: nikto_scan
        description: Run a Nikto web scan.
      - name: sqlmap_scan
        description: Run SQLMap to detect and exploit SQL injection flaws (batch mode).
      - name: dirb_scan
        description: Run Dirb for web content / directory brute-forcing.
      - name: whatweb_scan
        description: Run WhatWeb to identify CMS, web technologies, and headers of a website.
      - name: hashcat_crack
        description: Run Hashcat to crack an inline hash string.
    
  vulnify:
    name: vulnify
    title: Vulnify CVE MCP
    description: Grounded CVE intelligence catalog from mez-0/vulnify.
    type: remote
    remote:
      url: "http://127.0.0.1:7457/"
      transport_type: streamable-http 
  
  zap:
    name: zap
    title: OWASP ZAP MCP
    description: Guided crawl, passive scan and JSON reports through dtkmn/mcp-zap-server.
    type: remote
    remote:
      url: "http://127.0.0.1:7456/mcp"
      transport_type: streamable-http
      headers:
        X-API-Key: "${MCP_API_KEY}"
    secrets:
      - name: MCP_API_KEY
        env: MCP_API_KEY
    
  curl:
    name: curl
    title: Curl MCP Server
    description: Full HTTP client for web penetration testing via calibress/curl-mcp.
    type: remote
    remote:
      url: "http://127.0.0.1:7458/mcp"
      transport_type: streamable-http
    tools:
      - name: curl_request
        description: Make HTTP requests with custom methods, headers, and body inspection
 
        