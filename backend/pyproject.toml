[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "DineshThumma9", email = "dineshthumma15@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "httpx2>=2.16.0",
    "langchain>=1.4.8",
    "langchain-groq>=1.1.3",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "mcp>=2.3.0",
    "sqlmodel>=0.0.48",
    "typst>=0.15.0",
]

[project.scripts]
app = "app:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
